<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" href="favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月の画像エクスポーター 選択</title>
<style>
  :root{
    --bg-deep:   #060912;
    --bg-mid:    #0d1526;
    --panel:     #101a30;
    --line:      #23324f;
    --moonlight: #eee9dc;
    --moonlight-dim: #b9b3a1;
    --silver:    #8fa3c7;
    --gold:      #c9a96e;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    height:100%;
    background: var(--bg-deep);
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    color: var(--moonlight);
    padding: 40px 20px;
  }

  .stage{
    width: min(92vw, 640px);
    text-align:center;
  }

  h1{
    font-family: "Iowan Old Style", "Palatino Linotype", "Hiragino Mincho ProN", serif;
    font-weight: 500;
    font-size: 26px;
    margin: 0 0 12px;
  }

  .desc{
    font-size: 13px;
    color: var(--moonlight-dim);
    line-height: 1.7;
    max-width: 480px;
    margin: 0 auto 40px;
  }

  .cards{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 520px){
    .cards{ grid-template-columns: 1fr; }
  }

  a.card{
    display: block;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 20px;
    text-decoration: none;
    color: var(--moonlight);
    transition: border-color .15s ease, transform .15s ease;
  }

  a.card:hover{
    border-color: var(--gold);
    transform: translateY(-2px);
  }

  .card .icon{
    width: 56px;
    height: 56px;
    border-radius: 50%;
    margin: 0 auto 16px;
  }

  .card.flip .icon{
    background: radial-gradient(circle at 35% 35%, #e8e6de, #2a2f3d 70%);
  }

  .card.noflip .icon{
    background: radial-gradient(circle at 65% 35%, #e8e6de, #2a2f3d 70%);
  }

  .card .title{
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .02em;
    margin-bottom: 8px;
    color: var(--moonlight);
  }

  .card .sub{
    font-size: 12px;
    color: var(--moonlight-dim);
    line-height: 1.6;
  }

  .card .tag{
    display: inline-block;
    margin-top: 14px;
    font-size: 10px;
    letter-spacing: .06em;
    color: var(--gold);
    border: 1px solid rgba(201,169,110,.35);
    border-radius: 20px;
    padding: 4px 12px;
  }

  .credit{
    margin-top: 34px;
    font-size: 10px;
    color: #3d476c;
    letter-spacing: .02em;
  }

  .credit a{
    color: #6c7cab;
    text-decoration: none;
    border-bottom: 1px solid rgba(108,124,171,.35);
  }
</style>
</head>
<body>

  <div class="stage">
    <h1>月の画像エクスポーター</h1>
    <p class="desc">
      月齢1〜30日分の月のイラスト画像を、個別またはZIP一括でダウンロードできるツールです。
      向きの異なる2つのバージョンから選んでください。
    </p>

    <div class="cards">
      <a class="card flip" href="MoonIMGexporterUpsideDown.html">
        <div class="icon"></div>
        <div class="title">上下反転あり</div>
        <div class="sub">通常の画面表示に合わせて<br>上下を補正済み</div>
        <span class="tag">標準</span>
      </a>

      <a class="card noflip" href="MoonIMGexporterOrg.html">
        <div class="icon"></div>
        <div class="title">反転なし（元データ）</div>
        <div class="sub">GitHub元データの<br>向きのまま</div>
        <span class="tag">元データ</span>
      </a>
    </div>

    <div class="credit">
      元画像:
      <a href="https://github.com/LazydaysCr/moon-phase-clock" target="_blank" rel="noopener">LazydaysCr/moon-phase-clock</a>
      （原案: <a href="https://github.com/nishad2m8" target="_blank" rel="noopener">nishad2m8</a>）より変換
    </div>
  </div>

</body>
</html>
