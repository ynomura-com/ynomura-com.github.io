<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月の画像エクスポーター</title>
<style>
  :root{
    --bg-deep:   #060912;
    --bg-mid:    #0d1526;
    --panel:     #101a30;
    --line:      #23324f;
    --moonlight: #eee9dc;
    --moonlight-dim: #b9b3a1;
    --silver:    #8fa3c7;
    --gold:      #c9a96e;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    min-height:100%;
    background: var(--bg-deep);
  }

  body{
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    color: var(--moonlight);
    padding: 40px 24px 60px;
  }

  .header{
    max-width: 920px;
    margin: 0 auto 32px;
    text-align: center;
  }

  h1{
    font-family: "Iowan Old Style", "Palatino Linotype", "Hiragino Mincho ProN", serif;
    font-weight: 500;
    font-size: 26px;
    margin: 0 0 10px;
    color: var(--moonlight);
  }

  .desc{
    font-size: 13px;
    color: var(--moonlight-dim);
    line-height: 1.7;
    max-width: 560px;
    margin: 0 auto;
  }

  .actions{
    max-width: 920px;
    margin: 0 auto 28px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  button{
    font-family: inherit;
    font-size: 13px;
    letter-spacing: .03em;
    color: var(--moonlight);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }

  button:hover{
    border-color: var(--gold);
    color: var(--gold);
  }

  button:disabled{
    opacity: .5;
    cursor: default;
  }

  .grid{
    max-width: 920px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 14px;
  }

  .cell{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 10px 14px;
    text-align: center;
  }

  .cell img{
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: #05070d;
    margin-bottom: 8px;
  }

  .cell .label{
    font-size: 11px;
    color: var(--moonlight-dim);
    margin-bottom: 8px;
    letter-spacing: .03em;
  }

  .cell a{
    display: inline-block;
    font-size: 11px;
    color: var(--silver);
    text-decoration: none;
    border-bottom: 1px solid rgba(143,163,199,.35);
    padding-bottom: 1px;
  }

  .cell a:hover{
    color: var(--gold);
    border-color: var(--gold);
  }

  .status{
    max-width: 920px;
    margin: 20px auto 0;
    text-align: center;
    font-size: 12px;
    color: var(--silver);
    min-height: 16px;
  }

  .credit{
    max-width: 920px;
    margin: 30px auto 0;
    text-align: center;
    font-size: 10px;
    color: #3d476c;
    letter-spacing: .02em;
  }

  .credit a{
    color: #6c7cab;
    text-decoration: none;
    border-bottom: 1px solid rgba(108,124,171,.35);
  }
</style>
</head>
<body>

  <div class="header">
    <h1>月の画像エクスポーター</h1>
    <p class="desc">
      月齢1〜30日分の月のイラスト画像を、個別または一括でPNGファイルとしてダウンロードできます。
      ファイル名は 1.png 〜 30.png になります。
    </p>
  </div>

  <div class="actions">
    <button id="downloadAllBtn">すべてダウンロード（30枚）</button>
  </div>

  <div class="status" id="status"></div>

  <div class="grid" id="grid"></div>

  <div class="credit">
    元画像:
    <a href="https://github.com/LazydaysCr/moon-phase-clock" target="_blank" rel="noopener">LazydaysCr/moon-phase-clock</a>
    （原案: <a href="https://github.com/nishad2m8" target="_blank" rel="noopener">nishad2m8</a>）より変換
  </div>

  const grid = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  const downloadAllBtn = document.getElementById('downloadAllBtn');

  function dataUrl(base64){
    return `data:image/png;base64,${base64}`;
  }

  function buildGrid(){
    MOON_IMAGES.forEach((b64, i) => {
      const n = i + 1;
      const cell = document.createElement('div');
      cell.className = 'cell';

      const img = document.createElement('img');
      img.src = dataUrl(b64);
      img.alt = `${n}.png`;

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = `${n}.png`;

      const link = document.createElement('a');
      link.href = dataUrl(b64);
      link.download = `${n}.png`;
      link.textContent = 'ダウンロード';

      cell.appendChild(img);
      cell.appendChild(label);
      cell.appendChild(link);
      grid.appendChild(cell);
    });
  }

  function downloadOne(n, b64){
    const a = document.createElement('a');
    a.href = dataUrl(b64);
    a.download = `${n}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  async function downloadAll(){
    downloadAllBtn.disabled = true;
    for(let i = 0; i < MOON_IMAGES.length; i++){
      const n = i + 1;
      statusEl.textContent = `ダウンロード中… ${n} / ${MOON_IMAGES.length}`;
      downloadOne(n, MOON_IMAGES[i]);
      // ブラウザが連続ダウンロードをブロックしないよう、少し間隔をあける
      await new Promise(r => setTimeout(r, 180));
    }
    statusEl.textContent = `完了しました（${MOON_IMAGES.length}枚）。ブラウザによっては「複数ファイルのダウンロードを許可しますか」という確認が出ることがあります。`;
    downloadAllBtn.disabled = false;
  }

  downloadAllBtn.addEventListener('click', downloadAll);

  buildGrid();
</script>
